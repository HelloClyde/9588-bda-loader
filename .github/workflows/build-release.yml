name: 构建与发布

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 打包 BDA
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: 安装 MIPS 工具链
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu

      - name: 安装 BDA 打包器
        run: python -m pip install --requirement requirements-build.txt

      - name: 构建普通版与诊断版
        run: |
          python build.py --prefix mipsel-linux-gnu-
          python build.py --diagnostic --prefix mipsel-linux-gnu-

      - name: 生成校验文件
        working-directory: dist
        run: sha256sum BdaLoader.bda BdaLoaderDebug.bda > SHA256SUMS.txt

      - name: 上传 CI 产物
        uses: actions/upload-artifact@v4
        with:
          name: 9588-bda-loader-${{ github.sha }}
          path: |
            dist/BdaLoader.bda
            dist/BdaLoaderDebug.bda
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: 9588-bda-loader-${{ github.sha }}
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
